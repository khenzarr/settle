<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900">
  <title>Settle typography comparison</title>
  <defs><g id="i0"><path d="M3 4.2 8.2 2l7.2 4.1-3.3 4.1 3.1 2.1 3-3.7 3.3 2.8-6.1 7.4-7.1-4.9-5.3-3.2z"/><path d="m3 13.4 5.1 3.1 3.7-4.5 3.3 2.2-5.8 7.2L3 17.8z"/></g></defs>
  <rect width="1440" height="900" fill="#f4f1ea"/>
  <style>text{font-family:Arial,Helvetica,sans-serif;fill:#17232b}.mono{font-family:Consolas,'Courier New',monospace}.label{font-size:14px;letter-spacing:2px;font-weight:700}.head{font-size:42px;font-weight:700}.body{font-size:18px}.sample{font-size:30px;font-weight:700}.meta{font-size:13px}</style>
  <text x="56" y="64" class="label">SETTLE / TYPE COMPARISON / I-0 LOCKUP</text>
  <text x="56" y="106" class="body">Three serious directions. Live text only; licensing and redistribution require verification.</text>
  <g transform="translate(56 150)"><rect width="420" height="680" rx="16" fill="#fff" stroke="#c7d1cf"/><text x="28" y="48" class="label">DIRECTION A</text><use href="#i0" transform="translate(22 62) scale(2)" fill="#17232b"/><text x="77" y="104" class="head" font-family="Segoe UI Variable,Segoe UI,Arial,sans-serif">Settle</text><text x="28" y="174" class="head" font-family="Segoe UI Variable,Segoe UI,Arial,sans-serif"><tspan x="28" y="174">Programmable</tspan><tspan x="28" y="220">settlement</tspan></text><text x="28" y="272" class="body" font-family="Segoe UI Variable,Segoe UI,Arial,sans-serif">Precise infrastructure for payments that</text><text x="28" y="300" class="body" font-family="Segoe UI Variable,Segoe UI,Arial,sans-serif">resolve with clear state and accountable</text><text x="28" y="328" class="body" font-family="Segoe UI Variable,Segoe UI,Arial,sans-serif">evidence.</text><text x="28" y="386" class="sample" font-family="Segoe UI Variable,Segoe UI,Arial,sans-serif">0.05 USDC</text><text x="28" y="432" class="sample" font-family="Segoe UI Variable,Segoe UI,Arial,sans-serif">90.00%</text><text x="28" y="492" class="mono">0x221c...1765</text><text x="28" y="554" class="label">SETTLEMENT STATE</text><text x="28" y="602" class="meta">confirmed / buyer-controlled / ArcScan</text><text x="28" y="656" class="label">Segoe UI Variable + Consolas</text></g>
